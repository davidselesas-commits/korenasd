<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070714">
  <meta name="description" content="Watch featured videos on videy.co">
  <title>videy.co</title>

  <style>
    :root {
      --bg: #070714;
      --card-bg: rgba(18, 17, 38, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #8b5cf6;
      --primary-glow: rgba(139, 92, 246, 0.35);
      --accent: #38bdf8;
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      color: var(--text);
      background-color: var(--bg);
      background-image:
        radial-gradient(at 0% 0%, rgba(139, 92, 246, 0.22) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(56, 189, 248, 0.18) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(15, 23, 42, 0.5) 0px, transparent 100%);
      background-attachment: fixed;
    }

    .container {
      width: 100%;
      max-width: 440px;
      padding: 28px 24px;
      text-align: center;
      border: 1px solid var(--card-border);
      border-radius: 28px;
      background: var(--card-bg);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      box-shadow: 
        0 20px 50px -10px rgba(0, 0, 0, 0.6),
        0 0 0 1px rgba(255, 255, 255, 0.05);
      position: relative;
      overflow: hidden;
    }

    /* Ambient accent line top of card */
    .container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 15%;
      right: 15%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(167, 139, 250, 0.5), transparent);
    }

    .brand {
      margin-bottom: 20px;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    .brand span {
      background: linear-gradient(135deg, #c084fc, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      padding: 6px 14px;
      border: 1px solid rgba(139, 92, 246, 0.25);
      border-radius: 9999px;
      color: #ddd6fe;
      background: rgba(139, 92, 246, 0.08);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 10px #22c55e;
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }

    h1 {
      margin: 0 0 8px;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.6px;
    }

    .subtitle {
      margin: 0 auto 22px;
      max-width: 320px;
      color: var(--muted);
      font-size: 13.5px;
      line-height: 1.5;
    }

    /* Modern Video Preview Card */
    .player-wrap {
      position: relative;
      margin: 0 auto;
      max-width: 310px;
    }

    .player {
      position: relative;
      width: 100%;
      aspect-ratio: 9 / 16;
      border-radius: 22px;
      overflow: hidden;
      cursor: pointer;
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 16px 40px -10px rgba(0, 0, 0, 0.7);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s ease;
    }

    .player:hover {
      transform: translateY(-2px);
      box-shadow: 0 20px 48px -10px rgba(139, 92, 246, 0.35);
    }

    .thumbnail {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .player:hover .thumbnail {
      transform: scale(1.05);
    }

    .shade {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(0, 0, 0, 0.1) 0%,
        transparent 40%,
        rgba(0, 0, 0, 0.85) 100%
      );
    }

    .play-button-outer {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 68px;
      height: 68px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      transition: transform 0.3s ease, background 0.3s ease;
    }

    .play-button {
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: linear-gradient(135deg, #a855f7, #3b82f6);
      box-shadow: 0 0 25px var(--primary-glow);
      transition: transform 0.2s ease;
    }

    .player:hover .play-button-outer {
      transform: translate(-50%, -50%) scale(1.08);
      background: rgba(255, 255, 255, 0.25);
    }

    .play-icon {
      width: 0;
      height: 0;
      margin-left: 4px;
      border-top: 9px solid transparent;
      border-bottom: 9px solid transparent;
      border-left: 15px solid white;
    }

    .player-badges {
      position: absolute;
      bottom: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-weight: 600;
      color: #fff;
    }

    .badge {
      background: rgba(0, 0, 0, 0.6);
      padding: 4px 8px;
      border-radius: 6px;
      backdrop-filter: blur(4px);
    }

    /* Stats Grid */
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 20px 0;
    }

    .stat {
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.025);
      transition: background 0.2s;
    }

    .stat:hover {
      background: rgba(255, 255, 255, 0.04);
    }

    .stat-number {
      display: block;
      color: #e2e8f0;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.3px;
    }

    .stat-label {
      color: var(--muted);
      font-size: 11px;
      margin-top: 2px;
      display: block;
    }

    /* Redirect Card with dynamic progress */
    .redirect-box {
      position: relative;
      padding: 18px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }

    .progress-bar-bg {
      position: absolute;
      top: 0;
      left: 0;
      height: 3px;
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
    }

    .progress-bar {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #8b5cf6, #38bdf8);
      transition: width 1s linear;
    }

    .redirect-status {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .redirect-message {
      font-size: 13px;
      font-weight: 600;
      color: #cbd5e1;
      margin: 0;
      text-align: left;
    }

    .countdown-pill {
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.12);
      padding: 2px 10px;
      border-radius: 100px;
      font-variant-numeric: tabular-nums;
    }

    .buttons {
      display: flex;
      gap: 10px;
    }

    button {
      flex: 1;
      min-height: 44px;
      padding: 10px 16px;
      border: 0;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.15s ease, opacity 0.2s ease, filter 0.2s ease;
    }

    button:active {
      transform: scale(0.98);
    }

    .continue {
      color: #fff;
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      box-shadow: 0 4px 15px rgba(124, 58, 237, 0.35);
    }

    .continue:hover {
      filter: brightness(1.1);
    }

    .cancel {
      color: var(--muted);
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.05);
    }

    .cancel:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
    }

    .footer {
      margin-top: 22px;
      color: #64748b;
      font-size: 11.5px;
      letter-spacing: 0.2px;
    }

    @media (max-width: 380px) {
      .container {
        padding: 20px 16px;
      }
      h1 {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="brand">videy<span>.co</span></div>

    <div class="eyebrow">
      <span class="live-dot"></span>
      Featured Stream
    </div>

    <h1>Watch the Video</h1>
    <p class="subtitle">
      Tap the player to begin immediately, or wait for auto-redirect.
    </p>

    <div class="player-wrap">
      <div
        class="player"
        id="videoPlayer"
        role="button"
        tabindex="0"
        aria-label="Open video"
      >
        <img
          class="thumbnail"
          id="thumbnail"
          src=""
          alt="Video thumbnail preview"
        >

        <div class="shade"></div>

        <div class="play-button-outer" aria-hidden="true">
          <div class="play-button">
            <span class="play-icon"></span>
          </div>
        </div>

        <div class="player-badges">
          <span class="badge">▶ Tap to play</span>
          <span class="badge">HD</span>
        </div>
      </div>
    </div>

    <div class="stats">
      <div class="stat">
        <span class="stat-number" id="watchingCount">—</span>
        <span class="stat-label">Watching Now</span>
      </div>

      <div class="stat">
        <span class="stat-number" id="totalViews">—</span>
        <span class="stat-label">Total Views</span>
      </div>
    </div>

    <section class="redirect-box" aria-live="polite">
      <div class="progress-bar-bg">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <div class="redirect-status">
        <p class="redirect-message" id="redirectMessage">Redirecting in</p>
        <span class="countdown-pill" id="countdown">5s</span>
      </div>

      <div class="buttons">
        <button class="continue" id="continueButton">
          Continue now
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>

        <button class="cancel" id="cancelButton">
          Cancel
        </button>
      </div>
    </section>

    <div class="footer">
      © videy.co • All rights reserved
    </div>
  </main>

  <script>
    const TARGET_URL = "https://www.profitableratecpmnetwork.com/niywv4apz3?key=160c855cd7b5bef9f3ebac29dcb02270";

    const thumbnails = [
      "https://raw.githubusercontent.com/davidselesas-commits/korenasd/main/image1.jpg",
      "https://raw.githubusercontent.com/davidselesas-commits/korenasd/main/image2.jpg",
      "https://raw.githubusercontent.com/davidselesas-commits/korenasd/main/image3.jpg",
      "https://raw.githubusercontent.com/davidselesas-commits/korenasd/main/image4.jpg",
      "https://raw.githubusercontent.com/davidselesas-commits/korenasd/main/image5.jpg"
    ];

    const DELAY_SECONDS = 5;
    const AUTO_REDIRECT = true;

    const randomThumbnail = thumbnails[Math.floor(Math.random() * thumbnails.length)];
    const thumbnailElement = document.getElementById("thumbnail");
    thumbnailElement.src = randomThumbnail;

    thumbnailElement.onerror = function () {
      this.onerror = null;
      this.src = thumbnails[0];
    };

    let secondsLeft = DELAY_SECONDS;
    let timer = null;
    let redirectCancelled = false;

    const countdownElement = document.getElementById("countdown");
    const progressBar = document.getElementById("progressBar");
    const messageElement = document.getElementById("redirectMessage");
    const cancelButton = document.getElementById("cancelButton");
    const continueButton = document.getElementById("continueButton");
    const player = document.getElementById("videoPlayer");

    function openDestination() {
      if (!TARGET_URL) {
        messageElement.textContent = "URL destination missing.";
        clearInterval(timer);
        return;
      }
      window.location.href = TARGET_URL;
    }

    function updateCountdown() {
      countdownElement.textContent = `${secondsLeft}s`;
      
      const percent = ((DELAY_SECONDS - secondsLeft) / DELAY_SECONDS) * 100;
      progressBar.style.width = `${100 - percent}%`;

      if (secondsLeft <= 0) {
        clearInterval(timer);
        progressBar.style.width = '0%';

        if (!redirectCancelled && AUTO_REDIRECT) {
          openDestination();
        } else {
          messageElement.textContent = "Redirect stopped.";
        }
        return;
      }

      secondsLeft--;
    }

    function startCountdown() {
      if (!AUTO_REDIRECT) {
        messageElement.textContent = "Ready when you are.";
        countdownElement.textContent = "—";
        progressBar.style.display = "none";
        return;
      }

      updateCountdown();
      timer = setInterval(updateCountdown, 1000);
    }

    cancelButton.addEventListener("click", function () {
      redirectCancelled = true;
      clearInterval(timer);

      messageElement.textContent = "Auto-redirect cancelled";
      countdownElement.textContent = "Off";
      progressBar.style.display = "none";
      cancelButton.disabled = true;
      cancelButton.style.opacity = "0.4";
      cancelButton.style.cursor = "default";
    });

    continueButton.addEventListener("click", openDestination);
    player.addEventListener("click", openDestination);

    player.addEventListener("keydown", function (event) {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        openDestination();
      }
    });

    function randomInteger(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    let demoViewers = randomInteger(9500, 10500);
    let demoPlays = randomInteger(120000, 180000);

    const watchingElement = document.getElementById("watchingCount");
    const viewsElement = document.getElementById("totalViews");

    function renderStats() {
      watchingElement.textContent = demoViewers.toLocaleString("en-US");
      viewsElement.textContent = demoPlays.toLocaleString("en-US");
    }

    renderStats();

    setInterval(function () {
      demoViewers = Math.max(0, demoViewers + randomInteger(-6, 8));
      demoPlays += randomInteger(1, 4);
      renderStats();
    }, 4000);

    startCountdown();
  </script>
</body>
</html>
