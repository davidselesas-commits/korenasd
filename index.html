```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090817">
  <meta name="description" content="Watch featured videos on videy.co">
  <title>videy.co</title>

  <style>
    :root {
      --bg: #090817;
      --panel: #15142a;
      --purple: #a78bfa;
      --blue: #38bdf8;
      --white: #f8fafc;
      --muted: #a1a1aa;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 28px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--white);
      background:
        radial-gradient(circle at 10% 10%, #31205c 0, transparent 35%),
        radial-gradient(circle at 90% 90%, #103450 0, transparent 35%),
        var(--bg);
    }

    .container {
      width: 100%;
      max-width: 460px;
      padding: 24px;
      text-align: center;
      border: 1px solid rgba(167, 139, 250, 0.2);
      border-radius: 26px;
      background: rgba(21, 20, 42, 0.9);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(18px);
    }

    .brand {
      margin-bottom: 18px;
      color: var(--white);
      font-size: 23px;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .brand span {
      color: var(--purple);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 13px;
      padding: 7px 12px;
      border: 1px solid rgba(167, 139, 250, 0.25);
      border-radius: 30px;
      color: #c4b5fd;
      background: rgba(139, 92, 246, 0.1);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.3px;
      text-transform: uppercase;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 9px #4ade80;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 25px;
      letter-spacing: -0.7px;
    }

    .subtitle {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    /* Vertical video preview */
    .player {
      position: relative;
      width: 100%;
      max-width: 330px;
      aspect-ratio: 9 / 16;
      margin: 0 auto;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 20px;
      background: #111827;
      cursor: pointer;
      box-shadow: 0 12px 38px rgba(0, 0, 0, 0.45);
    }

    .thumbnail {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.45s ease;
    }

    .player:hover .thumbnail {
      transform: scale(1.04);
    }

    .shade {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to top,
        rgba(0, 0, 0, 0.7),
        transparent 45%,
        rgba(0, 0, 0, 0.12)
      );
      pointer-events: none;
    }

    .play-button {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 72px;
      height: 72px;
      display: grid;
      place-items: center;
      transform: translate(-50%, -50%);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 50%;
      background: linear-gradient(135deg, #a855f7, #2563eb);
      box-shadow: 0 0 35px rgba(139, 92, 246, 0.5);
      transition: transform 0.2s ease;
    }

    .player:hover .play-button {
      transform: translate(-50%, -50%) scale(1.1);
    }

    .play-icon {
      width: 0;
      height: 0;
      margin-left: 5px;
      border-top: 12px solid transparent;
      border-bottom: 12px solid transparent;
      border-left: 18px solid white;
    }

    .preview-label {
      position: absolute;
      right: 14px;
      bottom: 14px;
      left: 14px;
      text-align: left;
      font-size: 12px;
      font-weight: 700;
      text-shadow: 0 2px 8px #000;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 18px 0;
    }

    .stat {
      padding: 14px 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 15px;
      background: rgba(255, 255, 255, 0.045);
    }

    .stat-number {
      display: block;
      margin-bottom: 5px;
      color: #c4b5fd;
      font-size: 20px;
      font-weight: 900;
    }

    .stat-label {
      color: var(--muted);
      font-size: 11px;
    }

    .redirect-box {
      margin-top: 18px;
      padding: 16px;
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 17px;
      background: rgba(14, 165, 233, 0.06);
    }

    .redirect-message {
      margin: 0 0 8px;
      font-size: 13px;
      font-weight: 700;
    }

    .countdown {
      margin: 5px 0 14px;
      color: var(--blue);
      font-size: 32px;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
    }

    .buttons {
      display: flex;
      gap: 9px;
    }

    button {
      flex: 1;
      min-height: 43px;
      padding: 10px 12px;
      border: 0;
      border-radius: 11px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
    }

    button:hover {
      transform: translateY(-1px);
    }

    .continue {
      color: white;
      background: linear-gradient(100deg, #8b5cf6, #2563eb);
    }

    .cancel {
      color: #e5e7eb;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.06);
    }

    .footer {
      margin-top: 20px;
      color: #71717a;
      font-size: 11px;
    }

    @media (max-width: 380px) {
      .container {
        padding: 18px 14px;
      }

      h1 {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="brand">videy<span>.co</span></div>

    <div class="eyebrow">
      <span class="live-dot"></span>
      Featured video
    </div>

    <h1>Watch the Video</h1>
    <p class="subtitle">
      Tap the preview to continue watching.
    </p>

    <div
      class="player"
      id="videoPlayer"
      role="button"
      tabindex="0"
      aria-label="Open video"
    >
      <img
        class="thumbnail"
        id="thumbnail"
        src=""
        alt="Video thumbnail"
      >

      <div class="shade"></div>

      <div class="play-button" aria-hidden="true">
        <span class="play-icon"></span>
      </div>

      <div class="preview-label">▶ Tap to watch</div>
    </div>

    <div class="stats">
      <div class="stat">
        <span class="stat-number" id="watchingCount">—</span>
        <span class="stat-label">Demo viewers</span>
      </div>

      <div class="stat">
        <span class="stat-number" id="totalViews">—</span>
        <span class="stat-label">Demo plays</span>
      </div>
    </div>

    <section class="redirect-box" aria-live="polite">
      <p class="redirect-message" id="redirectMessage">
        Redirecting in
      </p>

      <div class="countdown" id="countdown">5</div>

      <div class="buttons">
        <button class="continue" id="continueButton">
          Continue now
        </button>

        <button class="cancel" id="cancelButton">
          Cancel
        </button>
      </div>
    </section>

    <div class="footer">
      © videy.co
    </div>
  </main>

  <script>
    // Destination URL: replace with your actual target.
    const TARGET_URL = "PASTE_YOUR_REDIRECT_URL_HERE";

    // Thumbnail images hosted in your GitHub repository.
    const thumbnails = [
      "https://raw.githubusercontent.com/davidselesas-commits/korenasd/main/image1.jpg",
      "https://raw.githubusercontent.com/davidselesas-commits/korenasd/main/image2.jpg",
      "https://raw.githubusercontent.com/davidselesas-commits/korenasd/main/image3.jpg",
      "https://raw.githubusercontent.com/davidselesas-commits/korenasd/main/image4.jpg",
      "https://raw.githubusercontent.com/davidselesas-commits/korenasd/main/image5.jpg"
    ];

    const DELAY_SECONDS = 5;
    const AUTO_REDIRECT = true;

    // Select one thumbnail randomly when the page loads.
    const randomThumbnail =
      thumbnails[Math.floor(Math.random() * thumbnails.length)];

    const thumbnailElement = document.getElementById("thumbnail");
    thumbnailElement.src = randomThumbnail;

    // Optional fallback if the selected image cannot be loaded.
    thumbnailElement.onerror = function () {
      this.onerror = null;
      this.src = thumbnails[0];
    };

    let secondsLeft = DELAY_SECONDS;
    let timer = null;
    let redirectCancelled = false;

    const countdownElement = document.getElementById("countdown");
    const messageElement = document.getElementById("redirectMessage");
    const cancelButton = document.getElementById("cancelButton");
    const continueButton = document.getElementById("continueButton");
    const player = document.getElementById("videoPlayer");

    function openDestination() {
      if (
        !TARGET_URL ||
        TARGET_URL === "PASTE_YOUR_REDIRECT_URL_HERE"
      ) {
        messageElement.textContent =
          "Please set the destination URL in the script.";
        clearInterval(timer);
        return;
      }

      window.location.href = TARGET_URL;
    }

    function updateCountdown() {
      countdownElement.textContent = secondsLeft;

      if (secondsLeft <= 0) {
        clearInterval(timer);

        if (!redirectCancelled && AUTO_REDIRECT) {
          openDestination();
        } else {
          messageElement.textContent = "Countdown complete.";
        }

        return;
      }

      secondsLeft--;
    }

    function startCountdown() {
      if (!AUTO_REDIRECT) {
        messageElement.textContent = "Ready when you are.";
        countdownElement.textContent = "—";
        return;
      }

      updateCountdown();
      timer = setInterval(updateCountdown, 1000);
    }

    cancelButton.addEventListener("click", function () {
      redirectCancelled = true;
      clearInterval(timer);

      messageElement.textContent = "Automatic redirect cancelled.";
      countdownElement.textContent = "×";
      cancelButton.disabled = true;
      cancelButton.style.opacity = "0.5";
    });

    continueButton.addEventListener("click", openDestination);
    player.addEventListener("click", openDestination);

    player.addEventListener("keydown", function (event) {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        openDestination();
      }
    });

    // Demo-only counters; these are not live analytics.
    function randomInteger(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    let demoViewers = randomInteger(9500, 10500);
    let demoPlays = randomInteger(120000, 180000);

    const watchingElement = document.getElementById("watchingCount");
    const viewsElement = document.getElementById("totalViews");

    function renderStats() {
      watchingElement.textContent =
        demoViewers.toLocaleString("en-US");

      viewsElement.textContent =
        demoPlays.toLocaleString("en-US");
    }

    renderStats();

    setInterval(function () {
      demoViewers = Math.max(
        0,
        demoViewers + randomInteger(-8, 12)
      );

      demoPlays += randomInteger(1, 5);
      renderStats();
    }, 4000);

    startCountdown();
  </script>
</body>
</html>
